; ============================================================
;  SUD Patch v1.0 - settings
;  1 = on, 0 = off
; ============================================================

[General]
; write SUD_Patch.log (if it is not in the game folder, look in
; %LOCALAPPDATA%\VirtualStore\Program Files (x86)\Smash up Derby)
Log=1

[Display]
; remove the 4:3 black bars in races (Hor+ widescreen)
Widescreen=1
; game resolution: 0 = desktop resolution, -1 = keep the game setting
; or set it by hand, e.g. Width=2560 / Height=1440
Width=0
Height=0
; white-screen guard: deletes a broken (non-DX8) copy of the game
; settings from the Windows VirtualStore
FixRegistry=1

[Sound]
; the game can no longer change its own slider in the Windows volume mixer
; (set it once in the mixer, Windows remembers it)
FixVolume=1

[Network]
; LAN server search (UDP 18023, multicast 225.226.227.228) on ALL network adapters
AllInterfaces=1
; also send the search as a broadcast on every adapter (helps with Radmin VPN)
BroadcastToo=1
; game UDP sockets listen on all adapters (without this, VPN connections drop)
BindAnyUDP=1
